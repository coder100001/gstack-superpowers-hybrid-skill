# Skills Route Table
# Machine-readable routing map: maps stage -> skill name -> trigger condition
# This is the SINGLE SOURCE OF TRUTH for skill routing.
# SKILL.md routing tables are readable summaries only — do not maintain separately.
# Consumed by scripts/resolve-skill-routes.sh
# Summary references are checked by scripts/check-skill-routes.sh

version: "5.0"
updated: "2026-06-26"
canonical_source: "schema/skill-routes.yaml"

routes:

  # ==== Superpowers Skills (状态机映射) ====
  superpowers:
    DISCOVERY:
      - name: brainstorming
        trigger: "L2+ tasks"
        purpose: "需求澄清、渐进式提问、方案探索、spec 文件"
      - name: using-superpowers
        trigger: "session start"
        purpose: "establish skill invocation pattern"
        auto_trigger: true

    ARCH_REVIEW:
      - name: design
        trigger: "L2+ tasks"
        purpose: "ADR 编写 (方案对比/设计决策存档)"

    TASK_DECOMPOSITION:
      - name: writing-plans
        trigger: "all tasks"
        purpose: "结构化 Plan (Spec→Task分解/5类模板/依赖图)"

    PLAN_CONFIRM:
      - name: plan-verification
        trigger: "all tasks"
        purpose: "Plan 验证确认 (范围/拆解/风险/验收硬阻断)"

    IMPLEMENTATION:
      - name: test-driven-development
        trigger: "all tasks"
        purpose: "TDD 编码"
      - name: dispatching-parallel-agents
        trigger: "2+ independent subtasks"
        purpose: "parallel agent dispatch"
        manual: true
      - name: executing-plans
        trigger: "plan available"
        purpose: "execute written plan in separate session"
        manual: true
      - name: subagent-driven-development
        trigger: "plan with independent tasks"
        purpose: "subagent execution within session"
        manual: true
      - name: using-git-worktrees
        trigger: "new feature needing isolation"
        purpose: "create isolated worktree"
        manual: true

    SELF_REVIEW:
      - name: requesting-code-review
        trigger: "L2+ tasks (optional)"
        purpose: "代码审查"
      - name: gstack:codex
        trigger: "L3 tasks"
        purpose: "跨模型审查"
      - name: subagent-driven-development
        trigger: "parallel task execution only"
        purpose: "SDD task review - only used when dispatching-parallel-agents"
        manual: true
      - name: receiving-code-review
        trigger: "review feedback received"
        purpose: "technical rigor before implementing suggestions"
        manual: true

    SHIP_REVIEW:
      - name: verification-before-completion
        trigger: "all tasks"
        purpose: "证据优先验证 — 必须先过 verification-evidence gate"
        note: "v6.0: 先过 verification-evidence gate，再执行 ship 流程"
      - name: gstack:ship
        trigger: "needs deploy/PR"
        purpose: "发布检查清单"
        note: "capable tier: ship 已内置 pre-landing review"

    EXCEPTION:
      - name: systematic-debugging
        trigger: "bugs, test failures, unexpected behavior"
        purpose: "原生根因调试主流程；先复现、查证据、锁定根因，再修复"
        manual: true

  # ==== Hybrid Skills ====
  hybrid:
    ENTRY:
      - name: gs-hybrid-v3
        trigger: "all tasks"
        purpose: "main entry point for AI Engineering Governance System"
        manual: true

  # ==== GStack Skills (激活条件) ====
  gstack:
    ARCH_REVIEW:
      - name: gstack:design-review
        trigger: "frontend UI/UX changes"
        detect:
          file_patterns: ["**/*.css", "**/*.scss", "**/*.tsx", "**/components/**", "**/styles/**"]
          keywords: ["UI", "UX", "style", "layout", "component", "design"]
        purpose: "前端视觉审查"
      - name: gstack:plan-eng-review
        trigger: "L2+ tasks"
        detect:
          complexity: ["L2", "L3"]
        purpose: "工程可行性审查"
      - name: gstack:plan-devex-review
        trigger: "L2+ tasks"
        detect:
          complexity: ["L2", "L3"]
        purpose: "开发者体验审查"

    QA:
      - name: gstack:qa
        trigger: "L3 tasks"
        detect:
          complexity: ["L3"]
        purpose: "QA 测试、功能验证"
      - name: gstack:cso
        trigger: "security-sensitive code"
        detect:
          file_patterns: ["**/auth/**", "**/security/**", "**/login/**", "**/password/**"]
          keywords: ["password", "token", "secret", "auth", "credential", "API_KEY", "SQL", "DROP", "DELETE"]
        purpose: "安全扫描"
      - name: gstack:benchmark
        trigger: "L3 + performance-sensitive tasks"
        detect:
          complexity: ["L3"]
          file_patterns: ["**/benchmark/**", "**/perf/**"]
          keywords: ["performance", "latency", "throughput", "benchmark", "optimize"]
        purpose: "性能基准测试"

    SELF_REVIEW:
      - name: gstack:codex
        trigger: "L3 tasks"
        detect:
          complexity: ["L3"]
        purpose: "跨模型审查"

    SHIP_REVIEW:
      - name: gstack:ship
        trigger: "needs deploy/PR after verification-evidence gate passes"
        purpose: "发布检查清单"

    RETRO:
      - name: gstack:retro
        trigger: "L3 tasks"
        detect:
          complexity: ["L3"]
        purpose: "工程复盘"

    EXCEPTION:
      - name: gstack:investigate
        trigger: "debugging, root cause analysis"
        detect:
          keywords: ["error", "bug", "fail", "exception", "crash", "debug"]
        purpose: "对 systematic-debugging 的治理增强：证据记录、冻结检查、回退决策、验证摘要"

    SAFETY:
      - name: gstack:careful
        trigger: "destructive commands, prod access"
        purpose: "warn before rm -rf, DROP TABLE, force-push"
        manual: true
      - name: gstack:freeze
        trigger: "debugging sessions"
        purpose: "restrict edits to specific directory"
        manual: true
      - name: gstack:guard
        trigger: "maximum safety needed"
        purpose: "careful + freeze combined"
        manual: true

    DISCOVERY:
      - name: gstack:context-restore
        trigger: "session resume"
        purpose: "restore previous working context"
        manual: true
      - name: gstack:context-save
        trigger: "session pause"
        purpose: "save working context for later"
        manual: true
      - name: gstack:learn
        trigger: "repeated patterns, past fixes"
        purpose: "manage project learnings across sessions"
        manual: true
