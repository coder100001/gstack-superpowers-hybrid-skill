# Gates Definition
# AI Engineering Governance System v5.0.0
# This is the SINGLE SOURCE OF TRUTH for gate definitions.
# Do NOT duplicate this content in SKILL.md or other documents.

version: "5.0.0"
updated: "2026-05-29"
adr_ref: "ADR-009"

metadata:
  description: |
    Gate definitions for AI Engineering Governance System.
    Each gate defines a hard blocking condition that must be satisfied
    before transitioning to the target state.
  canonical_source: "governance/gates.yaml"
  backup_source: "governance/gates.json"

gates:
  requirement-lock:
    id: "G001"
    name: "requirement-lock"
    description: "用户是否明确确认了需求清单；L1 可使用 workflow-state/context 的对话确认记录"
    script: "governance/gates/requirement-lock.sh"
    applies_to:
      - REQUIREMENT_LOCK
    severity: "hard"
    l1_exempt: false
    fail_message: "REQUIREMENT_LOCK 未通过：用户未确认需求"
    exit_codes:
      pass: 0
      block: 1
      infra_error: 2
    remediation:
      - "运行 /brainstorm 生成需求文档"
      - "确认需求后运行 /plan"
      - "L1 快速通道可写入 requirements_confirmed: true 与 approval_mode: conversation"
      - "或手动创建 spec 文件并添加 ## Approval 章节"

  requirement-structure:
    id: "G009"
    name: "requirement-structure"
    description: "需求文档是否包含问题定义/问题证据/范围/非目标/验收标准/Risk Tags"
    script: "governance/gates/requirement-structure.sh"
    applies_to:
      - REQUIREMENT_LOCK
    severity: "soft"
    severity_by_level:
      L1: "soft"
      L2: "hard"
      L3: "hard"
    l1_exempt: true
    fail_message: "REQUIREMENT_LOCK 质量告警：需求结构不完整，建议补充后继续"
    exit_codes:
      pass: 0
      block: 1
      infra_error: 2
    remediation:
      - "补齐需求文档结构：问题定义、问题证据、范围、非目标、验收标准、Risk Tags"
      - "确保各章节有明确可执行内容"

  measurable-acceptance:
    id: "G012"
    name: "measurable-acceptance"
    description: "验收标准是否具备可测性（可观测指标或阈值）"
    script: "governance/gates/measurable-acceptance.sh"
    applies_to:
      - REQUIREMENT_LOCK
    severity: "soft"
    l1_exempt: true
    fail_message: "REQUIREMENT_LOCK 质量告警：验收项不可测，建议补充可观测指标后继续"
    exit_codes:
      pass: 0
      block: 1
      infra_error: 2
    remediation:
      - "将验收项改写为可测标准（阈值、时延、成功率、错误率等）"
      - "避免'体验更好'等不可观测描述"

  arch-review-lock:
    id: "G002"
    name: "arch-review-lock"
    description: "L2+ 任务是否有 ADR 记录且包含决策状态"
    script: "governance/gates/arch-review-lock.sh"
    applies_to:
      - ARCH_REVIEW
    severity: "hard"
    l1_exempt: true
    fail_message: "ARCH_REVIEW 未通过：缺少 ADR 或 ADR 未包含决策状态"
    exit_codes:
      pass: 0
      block: 1
      infra_error: 2
    remediation:
      - "创建 ADR 文件: decision-layer/adr/ADR-NNN-title.md"
      - "确保 ADR 包含 Status、Context、Decision 章节"
      - "L1 任务可豁免此 Gate"

  design-tradeoff:
    id: "G010"
    name: "design-tradeoff"
    description: "方案设计是否包含备选方案、权衡分析与最终决策"
    script: "governance/gates/design-tradeoff.sh"
    applies_to:
      - ARCH_REVIEW
    severity: "soft"
    severity_by_level:
      L2: "soft"
      L3: "hard"
    l1_exempt: true
    fail_message: "ARCH_REVIEW 质量告警：设计权衡信息不完整，建议补充后继续"
    exit_codes:
      pass: 0
      block: 1
      infra_error: 2
    remediation:
      - "在 ADR 中至少列出两个备选方案"
      - "补充 trade-off（复杂度/风险/成本/性能）"
      - "明确最终决策与理由"
      - "ADR 是唯一设计产物，不维护平行设计文档"

  task-decomposition-lock:
    id: "G003"
    name: "task-decomposition-lock"
    description: "L2/L3 需 plan 文件存在且不含占位符并已确认；L1 可使用 workflow-state/context 的摘要确认"
    script: "governance/gates/task-decomposition-lock.sh"
    applies_to:
      - TASK_DECOMPOSITION
    severity: "hard"
    l1_exempt: false
    fail_message: "TASK_DECOMPOSITION 未通过：plan 缺失、含占位符或未确认"
    exit_codes:
      pass: 0
      block: 1
      infra_error: 2
    remediation:
      - "运行 /plan 生成执行计划"
      - "确保 plan 文件无 TBD/TODO/PLACEHOLDER"
      - "L1 快速通道可写入 plan_summary_confirmed: true"
      - "用户确认执行计划"

  plan-confirm:
    id: "G004"
    name: "plan-confirm"
    description: "用户已明确确认执行计划；L1 可使用 workflow-state/context 的对话确认"
    script: "governance/gates/plan-confirm.sh"
    applies_to:
      - PLAN_CONFIRM
    severity: "hard"
    l1_exempt: false
    fail_message: "PLAN_CONFIRM 未通过：用户未确认执行计划"
    exit_codes:
      pass: 0
      block: 1
      infra_error: 2
    remediation:
      - "向用户展示完整执行计划"
      - "展示 Requirement Mapping 摘要，确认 REQ/NFR/OUT 覆盖无缺口"
      - "获取用户明确确认（口头或书面）"
      - "L1 快速通道可写入 plan_confirmed: true 与 approval_mode: conversation"
      - "确认范围、拆解、风险、验收标准"

  requirement-design-coverage:
    id: "G011"
    name: "requirement-design-coverage"
    description: "spec 中的 REQ/NFR/OUT 条目是否在 ADR 和 plan 中得到显式覆盖"
    script: "governance/gates/requirement-design-coverage.sh"
    applies_to:
      - PLAN_CONFIRM
    severity: "soft"
    l1_exempt: true
    fail_message: "PLAN_CONFIRM 质量告警：存在未覆盖需求，建议补齐映射后继续"
    exit_codes:
      pass: 0
      block: 1
      infra_error: 2
    remediation:
      - "优先在 ADR 中补充对未覆盖需求的设计响应（单一设计产物）"
      - "plan 仅补充执行拆解，不新增平行设计文档"
      - "在 spec 中使用 REQ/NFR/OUT 编号（如 REQ-001, NFR-001, OUT-001）"
      - "在 ADR 中补充 Requirement Mapping，在 plan 中补充 Requirement Mapping / Task Covers"
      - "确保关键需求在 ADR 与 plan 中可追踪"

  discovery-risk-tags:
    id: "G013"
    name: "discovery-risk-tags"
    description: "DISCOVERY 输出是否包含最小风险标签集合"
    script: "governance/gates/discovery-risk-tags.sh"
    applies_to:
      - DISCOVERY
    severity: "soft"
    l1_exempt: true
    fail_message: "DISCOVERY 质量告警：风险标签不完整，建议补齐后继续"
    exit_codes:
      pass: 0
      block: 1
      infra_error: 2
    remediation:
      - "在 spec 中补充 Risk Tags 章节"
      - "至少包含 business / technical / dependency 三类标签"

  context-hydration:
    id: "G005"
    name: "context-hydration"
    description: "所有 P0 Spec 文件是否存在"
    script: "governance/gates/context-hydration.sh"
    applies_to:
      - CONTEXT_HYDRATION
    severity: "hard"
    l1_exempt: false
    fail_message: "CONTEXT_HYDRATION 未通过：缺少上下文契约文件"
    exit_codes:
      pass: 0
      block: 1
      infra_error: 2
    remediation:
      - "确保 P0 文件存在: project-spec.md, architecture-spec.md"
      - "L2+ 任务还需: api-spec.md, test-spec.md, constraints-spec.md, domain-boundaries.md"
      - "检查 bridges/context-hydration.md 了解注水流程"

  decision-freeze:
    id: "G006"
    name: "decision-freeze"
    description: "自上次 ARCH_REVIEW 后 ADR/specs 是否未被修改"
    script: "governance/gates/decision-freeze.sh"
    applies_to:
      - IMPLEMENTATION
    severity: "hard"
    l1_exempt: false
    fail_message: "决策冻结违规：IMPLEMENTATION 期间不得修改 ADR 或 Specs"
    exit_codes:
      pass: 0
      block: 1
      infra_error: 2
    remediation:
      - "如果需要修改冻结项，请先回退到 Decision Layer"
      - "运行: transition.sh IMPLEMENTATION ARCH_REVIEW --reason change_request"
      - "或创建新的 ADR 记录变更决策"

  test-presence:
    id: "G007"
    name: "test-presence"
    description: "本次变更是否包含对应测试文件"
    script: "governance/gates/test-presence.sh"
    applies_to:
      - SELF_REVIEW
    severity: "hard"
    l1_exempt: false
    fail_message: "没有对应测试的代码不能进入 SELF_REVIEW"
    exit_codes:
      pass: 0
      block: 1
      infra_error: 2
    remediation:
      - "确保测试文件存在"
      - "检查 project-config.yml 中的 test_command 配置"
      - "参考 test-spec.md 了解测试要求"

  acceptance-check:
    id: "G008"
    name: "acceptance-check"
    description: "验收项与结果证据映射检查"
    script: "governance/gates/acceptance-check.sh"
    applies_to:
      - SHIP_REVIEW
    severity: "hard"
    l1_exempt: true
    fail_message: "存在未覆盖的验收项，请补充证据或调整验收标准"
    exit_codes:
      pass: 0
      block: 1
      infra_error: 2
    remediation:
      - "检查 plan 中的 acceptance 列表"
      - "确保每项验收标准都有对应测试/文档/截图证据"
      - "在 artifacts/acceptance/ 目录下补充证据文件"
      - "或更新 plan 调整验收标准"

  commit-message-format:
    id: "G014"
    name: "commit-message-format"
    description: "最近提交信息是否符合统一格式 type(scope): summary"
    script: "governance/gates/commit-message-format.sh"
    applies_to:
      - SHIP_REVIEW
    severity: "soft"
    l1_exempt: false
    fail_message: "SHIP_REVIEW 质量告警：提交信息格式不统一，建议规范后继续"
    exit_codes:
      pass: 0
      block: 1
      infra_error: 2
    remediation:
      - "使用格式: type(scope): summary（scope 可选）"
      - "允许 type: feat|fix|refactor|docs|test|chore|perf|ci|build|revert"
      - "建议在提交前自检最近提交信息格式一致性"

  verification-evidence:
    id: "G016"
    name: "verification-evidence"
    description: "SHIP_REVIEW 前必须有可机器检查的测试证据；L1 可使用 conversation + 证据确认"
    script: "governance/gates/verification-evidence.sh"
    applies_to:
      - SHIP_REVIEW
    severity: "hard"
    l1_exempt: false
    fail_message: "VERIFICATION_EVIDENCE 未通过：缺少测试验证证据"
    exit_codes:
      pass: 0
      block: 1
      infra_error: 2
    remediation:
      - "运行测试并将输出保存到 artifacts/verification/ 目录"
      - "设置 context test_output 包含测试结果"
      - "L1 快速通道可设置 verification_confirmed: true + approval_mode: conversation"

validation_rules:
  gate_uniqueness: true
  script_existence: true
  applies_to_validity: true
  severity_values: ["hard", "soft", "warning"]
  required_fields:
    - id
    - name
    - description
    - script
    - applies_to
    - severity
    - fail_message
  optional_fields:
    - severity_by_level
