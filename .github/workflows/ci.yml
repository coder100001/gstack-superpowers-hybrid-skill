name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check
        run: |
          find scripts/ -name "*.sh" -exec bash -n {} \;
          echo "All shell scripts syntax OK"

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/sync-upstream.sh
          echo "Shellcheck passed"

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skill schema + route validation
        run: |
          bash scripts/validate-skills.sh

      - name: Markdown link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --no-progress
            --exclude 'http://localhost'
            --exclude 'https://github.com/coder100001'
            --exclude 'https://github.com/obra'
            --exclude 'https://github.com/gstack'
            --exclude 'https://opencode.ai'
            --exclude 'mailto:'
            --exclude 'skills/gstack/qa/templates/screenshots'
            --exclude-path 'skills/superpowers/writing-skills/anthropic-best-practices.md'
            -- './**/*.md'
          format: markdown
          fail: true
          jobSummary: true

      - name: Project integrity validation
        run: |
          bash scripts/validate-project.sh
